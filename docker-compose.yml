version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: localkart_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: localkart
    ports:
      - "5432:5432"
    volumes:
      - localkart_pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    container_name: localkart_api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:password@postgres:5432/localkart?schema=public
      JWT_SECRET: localkart_super_secret_jwt_key_change_in_production
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "5000:5000"
    command: >
      sh -c "npx prisma migrate deploy && node dist/server.js"

volumes:
  localkart_pgdata:
